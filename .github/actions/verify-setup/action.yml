name: Verify setup
description: Dependencies (after setup-node), the local Clerk keys (.env) and, when asked, local D1 and a Playwright browser
inputs:
  clerk-publishable-key:
    description: Clerk test publishable key, written to .env
    required: true
  clerk-secret-key:
    description: Clerk test secret key, written to .env
    required: true
  database:
    description: "'true' to migrate and fill the local D1 database"
    default: 'false'
  browser:
    description: "'true' to install the Playwright browser"
    default: 'false'
runs:
  using: composite
  steps:
    - run: npm ci
      shell: bash
      env:
        # The app runs onnxruntime-web in the browser; skip downloading Node CUDA binaries from NuGet.
        ONNXRUNTIME_NODE_INSTALL: skip
    - name: Local development Clerk keys
      shell: bash
      env:
        CLERK_PUBLISHABLE_KEY: ${{ inputs.clerk-publishable-key }}
        CLERK_SECRET_KEY: ${{ inputs.clerk-secret-key }}
      run: node -e 'require("fs").writeFileSync(".env", `CLERK_PUBLISHABLE_KEY=${process.env.CLERK_PUBLISHABLE_KEY}\nCLERK_SECRET_KEY=${process.env.CLERK_SECRET_KEY}\n`)'
    - if: inputs.database == 'true'
      shell: bash
      run: |
        npm run db:migrate:local
        npm run quiz:import:local
        npm run math:import:local
        npm run breaches:import:local
    # ubuntu-24.04 runners already include Chromium's shared libraries, so
    # avoid running `apt-get` via `--with-deps` on every job (which stalls for
    # minutes when Ubuntu mirrors are slow) and skip install on a cache hit.
    - id: playwright-cache
      if: inputs.browser == 'true'
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/ms-playwright
          ~/.local/share/fonts
        key: playwright-fonts-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    - if: inputs.browser == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        npx playwright install chromium
        mkdir -p ~/.local/share/fonts /tmp/pw-fonts
        (cd /tmp/pw-fonts && sudo apt-get update && apt-get download fonts-ipafont-gothic && dpkg-deb -x fonts-ipafont-gothic_*.deb extracted && find extracted -name '*.ttf' -exec cp {} ~/.local/share/fonts/ \;)
        rm -rf /tmp/pw-fonts
    - if: inputs.browser == 'true'
      shell: bash
      run: fc-cache -f ~/.local/share/fonts
