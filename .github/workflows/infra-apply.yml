name: Infra Apply

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or branch to apply (should already be on main)"
        required: true
        default: main

concurrency:
  group: infra-apply
  cancel-in-progress: false

permissions:
  contents: read

# Where the saved plan waits between the two jobs: the Terraform state bucket (R2), which only the state's own
# credentials can read. A plan file holds the values of sensitive attributes (the Access service token's secret, for
# one), so it is never an Actions artifact: in a public repository anyone signed in to GitHub can download those.
env:
  PLAN_KEY: paibot-app/plans/${{ github.run_id }}-${{ github.run_attempt }}.tfplan

jobs:
  plan:
    # Run from main only, so the workflow that holds the infra secrets is the reviewed one (the infra-apply
    # environment's branch rule says the same for the apply job).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      plan-sha256: ${{ steps.save.outputs.sha256 }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      # Only a commit already on main is applied: a branch or a SHA that never went through a pull request is refused.
      - name: Check the commit is on main
        id: commit
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          sha=$(git rev-parse HEAD)
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha (requested ref: $REQUESTED_REF) is not on main"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Applying commit: \`$sha\` (requested ref: \`$REQUESTED_REF\`)" >> "$GITHUB_STEP_SUMMARY"

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.12.2"

      - name: terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="endpoints={s3=\"https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com\"}"

      - name: terraform plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_TERRAFORM }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
        run: |
          terraform plan -input=false -out=tfplan
          terraform show -no-color tfplan | tee "$GITHUB_STEP_SUMMARY"

      # The plan file holds sensitive values in the clear (`terraform show` only hides them on screen), so it goes to
      # the state bucket, not to an artifact (see PLAN_KEY above). The apply job checks it gets the same bytes.
      - name: Save the plan in the state bucket
        id: save
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # Newer AWS CLIs add checksums R2 does not take on every call; only where the API requires one.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          aws s3api put-object --endpoint-url "https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --bucket "${{ vars.TF_STATE_BUCKET }}" --key "$PLAN_KEY" --body tfplan > /dev/null
          echo "sha256=$(sha256sum tfplan | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          rm tfplan

  # Gated by the "infra-apply" GitHub Environment: its required reviewers make a
  # human look at the `plan` job's summary (particularly for any destroy/replace)
  # before this job is allowed to start, and its branch rule allows main only
  # (the settings are in infra/README.md). This is the actual "review the plan,
  # then apply that exact plan" checkpoint — `apply` below runs the saved plan
  # verbatim, so what gets approved and what gets applied can't drift apart.
  apply:
    needs: plan
    runs-on: ubuntu-24.04
    environment: infra-apply
    defaults:
      run:
        working-directory: infra
    steps:
      # The commit the plan job checked and planned, not the ref again (a branch may have moved since).
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.12.2"

      - name: terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="endpoints={s3=\"https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com\"}"

      - name: Fetch the saved plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          PLAN_SHA256: ${{ needs.plan.outputs.plan-sha256 }}
        run: |
          aws s3api get-object --endpoint-url "https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --bucket "${{ vars.TF_STATE_BUCKET }}" --key "$PLAN_KEY" tfplan > /dev/null
          echo "$PLAN_SHA256  tfplan" | sha256sum -c -

      # R2 has no native object versioning (confirmed — not assumed — against
      # Cloudflare's own docs/community feedback), so back up the live state
      # object under a separate key before writing to it. Recovery procedure
      # is in infra/README.md.
      - name: Back up current state before apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          endpoint="https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          bucket="${{ vars.TF_STATE_BUCKET }}"
          key="paibot-app/terraform.tfstate"
          backup_key="paibot-app/backups/terraform.tfstate.$(date -u +%Y%m%dT%H%M%SZ)-${{ github.run_id }}"
          # `terraform init` above already proved these credentials work, so a
          # failure here almost never means "bad auth" — but don't blanket-swallow
          # every failure either. Only treat "the object doesn't exist yet" (the
          # legitimate first-apply case) as fine; anything else stops the run
          # rather than risk applying without a backup.
          if ! output=$(aws s3api copy-object --endpoint-url "$endpoint" \
            --bucket "$bucket" --key "$backup_key" \
            --copy-source "$bucket/$key" 2>&1); then
            if echo "$output" | grep -qi "NoSuchKey"; then
              echo "No existing state object to back up yet (first apply) — continuing."
            else
              echo "$output" >&2
              echo "Backup copy failed for a reason other than 'no existing state' — stopping." >&2
              exit 1
            fi
          fi

      - name: terraform apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_TERRAFORM }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
        run: terraform apply -input=false tfplan

      # The plan is not kept once the job ends, applied or not. A plan never approved stays in the bucket; see
      # infra/README.md for removing those.
      - name: Remove the saved plan
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          rm -f tfplan
          aws s3api delete-object --endpoint-url "https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --bucket "${{ vars.TF_STATE_BUCKET }}" --key "$PLAN_KEY" > /dev/null
