name: Infra Plan

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra-plan.yml"
      - ".github/workflows/infra-apply.yml"
  # Plan-only manual run (e.g. to preview a plan before dispatching Infra Apply).
  # Only users with write access can trigger this, so it's safe to give it secrets.
  # It runs against whichever branch/commit you pick in the "Use workflow from" box.
  workflow_dispatch:

concurrency:
  group: infra-plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmt-and-validate:
    # Safe for any PR, including forks: no credentials involved.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.12.2"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  plan:
    needs: fmt-and-validate
    # Only run the authenticated plan for PRs from this repo, never forks
    # (forks don't receive repo secrets under the plain `pull_request` trigger
    # anyway; this makes the trust boundary explicit and skips a guaranteed-to-
    # fail auth attempt). A manual dispatch is always trusted.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.12.2"

      # Bucket name/endpoint aren't secret but can't be hardcoded in versions.tf
      # (Terraform backend blocks can't reference variables) — see infra/README.md.
      - name: terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="endpoints={s3=\"https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com\"}"

      # Plan only — this workflow never applies (the -out file below is only
      # to render a summary and is never uploaded or reused). Uses default
      # state locking (do not add -lock=false): a concurrent apply holding
      # the real R2 lock should make this wait or fail, not read a state
      # mid-write. `terraform plan` runs as its own step (not piped) so a
      # plan failure fails this step; `terraform show` is what's piped into
      # the summary, matching infra-apply.yml's pattern.
      - name: terraform plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_TERRAFORM }}
          # Who may open the development site (infra/variables.tf): a repository variable, not in the code.
          TF_VAR_dev_access_emails: ${{ vars.DEV_ACCESS_EMAILS }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
        run: |
          terraform plan -input=false -out=tfplan
          terraform show -no-color tfplan | tee "$GITHUB_STEP_SUMMARY"
