name: Incident list update

# Keeps the incident list (docs/breaches.md) current. The list lives in D1, where the page reads it. Every day this workflow takes the list out of the
# database, Claude Code reads the news and the organizations' own pages and edits it by the rules in .github/prompts/breaches-update.md, and, when
# the rules pass, the list is written into dev's database and production's. No pull request and no release: the list before and after, and Claude's
# report, are kept as the run's artifact (90 days) and the report is the run's summary. Run it by hand from the Actions tab at any time.
#
# Secrets (Settings > Secrets and variables > Actions):
#   CLAUDE_CODE_OAUTH_TOKEN: from `claude setup-token`; the run is paid out of the Claude plan's usage, not an API bill.
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_API_TOKEN_PRODUCTION: the same as the deploys use, for dev's and production's databases.
on:
  schedule:
    - cron: "10 0 * * *" # every day, 00:10 UTC (09:10 in Japan)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: breaches-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      # For wrangler, which reads the database.
      - run: npm ci
      - name: Today in Japan, and where the list and the report go
        run: |
          echo "TODAY=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/breaches"
          echo "BREACHES_DIR=$RUNNER_TEMP/breaches" >> "$GITHUB_ENV"
          echo "REPORT_FILE=$RUNNER_TEMP/breaches/report.md" >> "$GITHUB_ENV"
      # The newer of the two databases' lists (production's on a tie): production has none before the release that adds its tables, and that
      # release fills it from the copy in git, which may be older than dev's until this workflow next writes both.
      - name: Take the list out of the database
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DEV_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROD_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PRODUCTION }}
        run: |
          export_list() { CLOUDFLARE_API_TOKEN="$2" node scripts/export-breaches.mjs "$1" "$BREACHES_DIR/$1.json" || [ $? = 2 ]; }
          export_list prod "$PROD_TOKEN"
          export_list dev "$DEV_TOKEN"
          as_of() { [ -f "$1" ] && node -p "require('$1').asOf" || echo none; }
          prod=$(as_of "$BREACHES_DIR/prod.json")
          dev=$(as_of "$BREACHES_DIR/dev.json")
          echo "production's list: $prod, dev's: $dev"
          if [ "$prod" = none ] && [ "$dev" = none ]; then echo "::error::Neither database has the list"; exit 1; fi
          if [ "$prod" = none ] || [[ "$dev" > "$prod" ]]; then from=dev; else from=prod; fi
          echo "Starting from $from's"
          cp "$BREACHES_DIR/$from.json" "$BREACHES_DIR/before.json"
          cp "$BREACHES_DIR/$from.json" src/data/breaches.json
      # Which links of the list are dead (404/410, no answer), for Claude to replace: the entries marked FAIL and their dead links. A blocked page
      # (403) is only a warning and not passed on; whether a page still says what the entry says is not read here (`--no-content`).
      - name: Find the dead links
        run: |
          node scripts/check-breaches.mjs --no-content > "$BREACHES_DIR/links.txt" || true
          awk '/^FAIL /{show=1; print; next} /^(ok|WARN) /{show=0} show && /^ +FAIL /' "$BREACHES_DIR/links.txt" > "$BREACHES_DIR/dead-links.txt"
          echo "DEAD_LINKS_FILE=$BREACHES_DIR/dead-links.txt" >> "$GITHUB_ENV"
          tail -n 1 "$BREACHES_DIR/links.txt"
          cat "$BREACHES_DIR/dead-links.txt"
      # Claude may read the web and edit files, and run node (the tests and the source check); nothing else, so no git, gh or wrangler from inside.
      - name: Update the list
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            今日(JST)は ${{ env.TODAY }}。`.github/prompts/breaches-update.md` を読み、その手順どおりに `src/data/breaches.json` を更新してください。
            報告は、環境変数 REPORT_FILE が指すファイル(${{ env.REPORT_FILE }})に書いてください。
            今のリストのリンク切れは、環境変数 DEAD_LINKS_FILE が指すファイル(${{ env.DEAD_LINKS_FILE }})にあります(空ならありません)。
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 150
            --add-dir ${{ runner.temp }}
            --allowedTools "Read,Edit,Write,Glob,Grep,WebSearch,WebFetch,Bash(node:*)"
      # What Claude did, turn by turn (the log hides it): to find out why it denied a tool, or found nothing. Private repository, kept 14 days.
      - name: Keep Claude's record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: claude-execution-output
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Check what changed
        id: diff
        run: |
          # Only the list may change in the checkout (it was the database's list before Claude started).
          others=$(git status --porcelain | grep -v ' src/data/breaches.json$' || true)
          if [ -n "$others" ]; then echo "$others"; echo "::error::Only src/data/breaches.json may change"; exit 1; fi
          [ -s "$REPORT_FILE" ] && cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"
          if cmp -s "$BREACHES_DIR/before.json" src/data/breaches.json; then echo "No change."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ ! -s "$REPORT_FILE" ]; then echo "::error::The report is missing"; exit 1; fi
          cp src/data/breaches.json "$BREACHES_DIR/after.json"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # The rules every list must pass; a list that breaks one is never written (import-breaches.mjs checks them again).
      - name: Rules
        if: steps.diff.outputs.changed == 'true'
        run: node --test "src/tools/breaches/*.test.mjs"
      # A dead link Claude could not replace is said in the summary for a person, but does not hold the rest of the update back.
      - name: Dead links left
        run: |
          if node scripts/check-breaches.mjs --no-content > "$BREACHES_DIR/links-after.txt"; then tail -n 1 "$BREACHES_DIR/links-after.txt"; exit 0; fi
          grep -E '^FAIL |^ +FAIL ' "$BREACHES_DIR/links-after.txt" || true
          echo "::warning::Dead links are left in the incident list; see the summary."
          { echo; echo "## 残ったリンク切れ"; echo '```'; grep -E '^FAIL |^ +FAIL ' "$BREACHES_DIR/links-after.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the list before and after, and the report
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: breaches-${{ env.TODAY }}
          path: |
            ${{ runner.temp }}/breaches/before.json
            ${{ runner.temp }}/breaches/after.json
            ${{ runner.temp }}/breaches/report.md
          retention-days: 90

  # Writes the new list into dev's database, then production's. A job of its own, so Claude's job never holds the tokens that write.
  publish:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The production database: the same environment as App (production), so the same branch rule applies.
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: breaches-*
          merge-multiple: true
          path: ${{ runner.temp }}/breaches
      - run: cp "$RUNNER_TEMP/breaches/after.json" src/data/breaches.json
      - name: Write the list into dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run breaches:import:dev
      # Before the release that adds production's tables this does nothing and says so in a notice.
      - name: Write the list into production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PRODUCTION }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run breaches:import:prod -- --if-ready
