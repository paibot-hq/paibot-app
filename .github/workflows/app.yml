name: App (development)
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'infra/**', '.github/workflows/infra-*.yml']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'infra/**', '.github/workflows/infra-*.yml']
concurrency:
  group: app-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs can stop; a main run may be mid-migration or mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - name: Local development Clerk keys
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: node -e 'require("fs").writeFileSync(".dev.vars", `CLERK_PUBLISHABLE_KEY=${process.env.CLERK_PUBLISHABLE_KEY}\nCLERK_SECRET_KEY=${process.env.CLERK_SECRET_KEY}\n`)'
      - run: npm run check:quiz
      - run: npm run check:math-factorization
      - run: npm run check:math-pythagoras
      - run: npm run check:cidr
      - run: npm run check:legal
      - run: node scripts/check-math-pythagoras-tests.mjs
      - run: npm run check:math-arith
      # Deploy jobs need this job, so they import only SymPy-verified banks
      # and do not need Python themselves.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: npm run check:math-sympy
      - run: npm run db:migrate:local
      - run: npm run quiz:import:local
      - run: npm run math:import:local
      - run: npm run typecheck
      - run: npm run check:build-targets
      # Only the browser download is cached; install still runs so the OS
      # packages it needs land on the fresh runner either way.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run check:access
      - run: npm run check:i18n
      - run: npm run check:whois
      - run: npm run check:site-check
      - name: Browser checks against built Worker
        run: |
          npm run preview &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -sf http://localhost:3003/robots.txt > /dev/null && break; sleep 1; done
          CHECK_BROWSER_BASE_URL=http://localhost:3003 npm run check:smoke
          CHECK_BROWSER_BASE_URL=http://localhost:3003 npm run check:tools
          CHECK_BROWSER_BASE_URL=http://localhost:3003 npm run check:quiz-browser
  deploy-dev:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - run: npm run build
      # Applied before deploy so the newly deployed code never sees a schema
      # it doesn't recognize yet. Idempotent (wrangler tracks applied
      # migrations in d1_migrations and skips anything already applied).
      - name: Apply D1 migrations (dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run db:migrate:dev
          npm run quiz:import:dev
          npm run math:import:dev
      - name: Sync runtime Clerk keys and deploy dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          node -e 'console.log(JSON.stringify({CLERK_PUBLISHABLE_KEY:process.env.CLERK_PUBLISHABLE_KEY,CLERK_SECRET_KEY:process.env.CLERK_SECRET_KEY}))' | npx wrangler secret bulk --config build/server/wrangler.json
          npm run deploy -- --var APP_VERSION:${{ github.sha }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # A brand-new route can 404 on edge nodes that still serve the previous
      # version, so wait until dev reports this commit rather than sleeping.
      - name: Wait for the deploy to reach the edge
        env:
          CHECK_BROWSER_BASE_URL: https://dev.paibot.app
          EXPECTED_APP_VERSION: ${{ github.sha }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node scripts/wait-for-deploy.mjs
      - name: Smoke test deployed dev through Access
        env:
          CHECK_BROWSER_BASE_URL: https://dev.paibot.app
          CHECK_SITE_URL: https://dev.paibot.app
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          npm run check:smoke
          npm run check:quiz-browser
