name: App (development)
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'infra/**', '.github/workflows/infra-*.yml']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'infra/**', '.github/workflows/infra-*.yml']
concurrency:
  group: app-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs can stop; a main run may be mid-migration or mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  # .github/actions/ci-changes reads the run history to find the last commit on main that passed.
  actions: read
# A pull request from a fork gets no secrets (plain `pull_request`, never `pull_request_target`), so it runs only what needs
# none: `static` (no Clerk keys needed to test, typecheck and build) and `sympy`. `e2e` and `browser` serve pages, which
# fail without the development Clerk keys; they are skipped, and run once a maintainer pushes the change to a branch here.
jobs:
  # The checks run as three jobs side by side (plus `sympy`), each doing its own
  # setup; deploy-dev needs all of them. The three rebuild the app because the
  # last step of build-targets leaves the normal dev build behind.
  # No browser, no server: unit tests, types and the build targets of each environment.
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - uses: ./.github/actions/verify-setup
        with:
          clerk-publishable-key: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          clerk-secret-key: ${{ secrets.CLERK_SECRET_KEY }}
      # Every tests/unit/*.test.mjs (no build, server or browser needed).
      - run: npm test
      - run: npm run typecheck
      - run: npm run e2e -- build-targets
  # These start their own Workers/previews (tests/e2e/*.mjs headers).
  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      # Skipped when nothing it checks can have changed (scripts/ci-changes.mjs): since the base branch on a PR,
      # since the last commit that passed on main.
      - id: needed
        uses: ./.github/actions/ci-changes
        with:
          job: e2e
      - if: steps.needed.outputs.run == 'true'
        uses: ./.github/actions/verify-setup
        with:
          clerk-publishable-key: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          clerk-secret-key: ${{ secrets.CLERK_SECRET_KEY }}
          database: 'true'
          browser: 'true'
      - if: steps.needed.outputs.run == 'true'
        run: npm run build
      - if: steps.needed.outputs.run == 'true'
        run: npm run e2e -- access environments whois site-check
  # The tools are split between three jobs (CHECK_SHARD), as one job took nine minutes.
  browser:
    name: browser (${{ matrix.shard }}/3)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          # The affected tools are found from the history (see e2e).
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      # Skipped when no tool can have changed, or when this share of the tools is empty (a few all go to the first).
      - id: needed
        uses: ./.github/actions/ci-changes
        with:
          job: browser
          shard: ${{ matrix.shard }}/3
      - if: steps.needed.outputs.run == 'true'
        uses: ./.github/actions/verify-setup
        with:
          clerk-publishable-key: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          clerk-secret-key: ${{ secrets.CLERK_SECRET_KEY }}
          database: 'true'
          browser: 'true'
      - if: steps.needed.outputs.run == 'true'
        run: npm run build
      - if: steps.needed.outputs.run == 'true'
        name: Browser checks against built Worker
        run: |
          npm run preview &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -sf http://localhost:3003/robots.txt > /dev/null && break; sleep 1; done
          # The checks every tool shares cover the tools the change can reach; the tools' own flows only those it names
          # (scripts/ci-changes.mjs, browserScope in scripts/lib/ci-jobs.mjs).
          catalog="${{ steps.needed.outputs.catalog }}"
          tools="${{ steps.needed.outputs.tools }}"
          echo "Shared checks: ${catalog:-none}; flows: ${tools:-none}"
          export CHECK_SHARD="${{ matrix.shard }}/3" CHECK_BROWSER_BASE_URL=http://localhost:3003
          # The checks that are not per tool run once, in the first shard.
          if [ "${{ matrix.shard }}" = 1 ]; then CHECK_TOOLS="" npm run e2e -- smoke quiz-browser; fi
          CHECK_TOOLS="$catalog" npm run e2e -- catalog
          if [ -n "$tools" ]; then CHECK_TOOLS="$tools" npm run e2e -- tools; fi
  # SymPy re-derives every math answer (CPU only, no browser), so it runs beside
  # the other checks instead of before them. deploy-dev needs all of them, so only SymPy-verified
  # banks are imported and the deploy jobs do not need Python themselves.
  sympy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # For scripts/ci-changes.mjs only (no install).
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      # Checks only when the change touches what the check reads (since the base branch on a PR, since the last
      # commit that passed on main, so every bank deployed has been checked), and otherwise this job passes at once.
      - id: affected
        uses: ./.github/actions/ci-changes
        with:
          job: sympy
      # setup-uv publishes no major-version tags after v7, so pin the release.
      - if: steps.affected.outputs.run == 'true'
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - if: steps.affected.outputs.run == 'true'
        run: npm run test:sympy
  # The browser checks do not hold the deploy back: their flows drive whole pages and now and then time out on CI for reasons
  # of their own, and dev is where a page is looked at anyway. A failure still shows on the run.
  deploy-dev:
    needs: [static, e2e, sympy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - run: npm run build
      # Applied before deploy so the newly deployed code never sees a schema
      # it doesn't recognize yet. Idempotent (wrangler tracks applied
      # migrations in d1_migrations and skips anything already applied).
      - name: Apply D1 migrations (dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run db:migrate:dev
          npm run quiz:import:dev
          npm run math:import:dev
          # Only when dev has no list yet: the daily update (breaches-update.yml) keeps it current, not the copy in git.
          npm run breaches:import:dev -- --if-empty
      - name: Sync runtime Clerk keys and deploy dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          node -e 'console.log(JSON.stringify({CLERK_PUBLISHABLE_KEY:process.env.CLERK_PUBLISHABLE_KEY,CLERK_SECRET_KEY:process.env.CLERK_SECRET_KEY}))' | npx wrangler secret bulk --config build/server/wrangler.json
          npm run deploy -- --var APP_VERSION:${{ github.sha }}
      # A brand-new route can 404 on edge nodes that still serve the previous version, so wait until dev reports this
      # commit and every sitemap page answers 200 through Access (no browser here: the browser checks run beside the deploy).
      - name: Wait for the deploy to reach the edge
        env:
          CHECK_BROWSER_BASE_URL: https://dev.paibot.app
          EXPECTED_APP_VERSION: ${{ github.sha }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node scripts/wait-for-deploy.mjs
