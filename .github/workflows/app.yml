name: App (development)
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'infra/**', '.github/workflows/infra-*.yml']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'infra/**', '.github/workflows/infra-*.yml']
concurrency:
  group: app-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs can stop; a main run may be mid-migration or mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # The checks run as three jobs side by side (plus `sympy`), each doing its own
  # setup; deploy-dev needs all of them. The three rebuild the app because the
  # last step of build-targets leaves the normal dev build behind.
  # No browser, no server: unit tests, types and the build targets of each environment.
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - uses: ./.github/actions/verify-setup
        with:
          clerk-publishable-key: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          clerk-secret-key: ${{ secrets.CLERK_SECRET_KEY }}
      # Every tests/unit/*.test.mjs (no build, server or browser needed).
      - run: npm test
      - run: npm run typecheck
      - run: npm run e2e -- build-targets
  # These start their own Workers/previews (tests/e2e/*.mjs headers).
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      # A PR skips this job when nothing it checks can have changed (scripts/ci-changes.mjs);
      # main always runs it.
      - name: Is this job needed?
        id: needed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF" 2>/dev/null || true
          node scripts/ci-changes.mjs e2e >> "$GITHUB_OUTPUT"
      - if: steps.needed.outputs.run == 'true'
        uses: ./.github/actions/verify-setup
        with:
          clerk-publishable-key: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          clerk-secret-key: ${{ secrets.CLERK_SECRET_KEY }}
          database: 'true'
          browser: 'true'
      - if: steps.needed.outputs.run == 'true'
        run: npm run build
      - if: steps.needed.outputs.run == 'true'
        run: npm run e2e -- access environments whois site-check
  # The tools are split between three jobs (CHECK_SHARD), as one job took nine minutes.
  browser:
    name: browser (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          # PRs compare against the base branch to pick the affected tools. (A string:
          # `cond && 0 || 1` is always 1, because 0 is falsy.)
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      # A PR skips this job when nothing it checks can have changed (scripts/ci-changes.mjs);
      # main always runs it.
      - name: Is this job needed?
        id: needed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF" 2>/dev/null || true
          node scripts/ci-changes.mjs browser >> "$GITHUB_OUTPUT"
      - if: steps.needed.outputs.run == 'true'
        uses: ./.github/actions/verify-setup
        with:
          clerk-publishable-key: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          clerk-secret-key: ${{ secrets.CLERK_SECRET_KEY }}
          database: 'true'
          browser: 'true'
      - if: steps.needed.outputs.run == 'true'
        run: npm run build
      - if: steps.needed.outputs.run == 'true'
        name: Browser checks against built Worker
        run: |
          npm run preview &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -sf http://localhost:3003/robots.txt > /dev/null && break; sleep 1; done
          # PRs run the per-tool checks only for the tools they can affect
          # (scripts/affected-tools.mjs); main runs every tool.
          if [ "${{ github.event_name }}" = pull_request ]; then
            export CHECK_TOOLS="$(node scripts/affected-tools.mjs "origin/${{ github.base_ref }}")"
            echo "Affected tools: ${CHECK_TOOLS:-none}"
          fi
          export CHECK_SHARD="${{ matrix.shard }}/3"
          # The checks that are not per tool run once, in the first shard.
          if [ "${{ matrix.shard }}" = 1 ]; then checks="smoke catalog tools quiz-browser"; else checks="catalog tools"; fi
          CHECK_BROWSER_BASE_URL=http://localhost:3003 npm run e2e -- $checks
  # SymPy re-derives every math answer (CPU only, no browser), so it runs beside
  # the other checks instead of before them. deploy-dev needs all of them, so only SymPy-verified
  # banks are imported and the deploy jobs do not need Python themselves.
  sympy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      # main always checks (the deploy depends on it); a PR checks only when it
      # touches what the check reads, and otherwise this job passes at once.
      - name: Does this change affect the SymPy check?
        id: affected
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" || { echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; }
          # If the diff cannot be taken, check anyway.
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD") || { echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; }
          if echo "$changed" | grep -qE '^(src/data/math-[^/]*\.json|scripts/verify_math\.py|tests/unit/test_verify_math\.py|pyproject\.toml|uv\.lock|\.python-version|\.github/workflows/app\.yml)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No math bank, verifier or Python dependency changed; skipping the SymPy check on this PR."
          fi
      # setup-uv publishes no major-version tags after v7, so pin the release.
      - if: steps.affected.outputs.run == 'true'
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - if: steps.affected.outputs.run == 'true'
        run: npm run test:sympy
  deploy-dev:
    needs: [static, e2e, browser, sympy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - run: npm run build
      # Applied before deploy so the newly deployed code never sees a schema
      # it doesn't recognize yet. Idempotent (wrangler tracks applied
      # migrations in d1_migrations and skips anything already applied).
      - name: Apply D1 migrations (dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run db:migrate:dev
          npm run quiz:import:dev
          npm run math:import:dev
      - name: Sync runtime Clerk keys and deploy dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          node -e 'console.log(JSON.stringify({CLERK_PUBLISHABLE_KEY:process.env.CLERK_PUBLISHABLE_KEY,CLERK_SECRET_KEY:process.env.CLERK_SECRET_KEY}))' | npx wrangler secret bulk --config build/server/wrangler.json
          npm run deploy -- --var APP_VERSION:${{ github.sha }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # A brand-new route can 404 on edge nodes that still serve the previous
      # version, so wait until dev reports this commit rather than sleeping.
      - name: Wait for the deploy to reach the edge
        env:
          CHECK_BROWSER_BASE_URL: https://dev.paibot.app
          EXPECTED_APP_VERSION: ${{ github.sha }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node scripts/wait-for-deploy.mjs
      - name: Smoke test deployed dev through Access
        env:
          CHECK_BROWSER_BASE_URL: https://dev.paibot.app
          CHECK_SITE_URL: https://dev.paibot.app
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: npm run e2e -- smoke quiz-browser
