name: App

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
      # Terraform has its own workflows (infra-plan.yml / infra-apply.yml) and
      # doesn't affect the app build or the dev Worker deploy.
      - "infra/**"
      - ".github/workflows/infra-*.yml"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
      # Terraform has its own workflows (infra-plan.yml / infra-apply.yml) and
      # doesn't affect the app build or the dev Worker deploy.
      - "infra/**"
      - ".github/workflows/infra-*.yml"

concurrency:
  group: app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # npm ci also runs postinstall (patch-package --error-on-fail --error-on-warn),
      # which must succeed before anything else can build correctly. See CLAUDE.md.
      - run: npm ci

      # Clerk keys are needed at build time (vinext build reads .env.local, not just
      # runtime env) for check:i18n below to exercise real auth redirects.
      # Add NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY / CLERK_SECRET_KEY as repo secrets
      # (development instance keys — never production keys) for this to pass.
      # SITE_INDEXABLE is intentionally not set here: it's read live from a
      # Cloudflare Workers var at request time, not from .env.local/process.env
      # (confirmed in check-i18n.mjs, which sets it via `wrangler dev --var`
      # for its own spawned server instead). No `vars.SITE_INDEXABLE` is
      # declared for the dev Worker in wrangler.jsonc, so it defaults to
      # unset/false (non-indexable) — which is what we want for dev anyway.
      - name: Set up .env.local
        run: |
          cat <<EOF > .env.local
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
          SITE_URL=https://paibot.app
          EOF

      # `npm run typecheck` depends on .next/types/validator.ts, which only a plain
      # `next build` generates (vinext build does not). See CLAUDE.md.
      - run: npm run build:next
      - run: npm run typecheck

      - run: npm run build
      - run: npm run check:i18n

      # check:browser (Playwright against a live vinext dev server) is intentionally
      # not run here — it needs a browser install and a running dev server, and is
      # slower/flakier in CI (Clerk's widget loads from an external CDN). Run it
      # locally before merging changes that touch auth, theming, or i18n routing.

  deploy-dev:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # See the comment on the same step in the verify job above: SITE_INDEXABLE
      # isn't set via .env.local, it comes from a Workers var (none declared
      # for dev, so it defaults to non-indexable).
      - name: Set up .env.local
        run: |
          cat <<EOF > .env.local
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
          EOF

      - run: npm run build

      # Deploys the "paibot-app-dev" worker (see wrangler.jsonc) — a *.workers.dev
      # URL for development/verification only, not the paibot.app production site.
      - name: Deploy to Cloudflare Workers (dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config dist/server/wrangler.json

      # These are separate from the .env.local step above: that only affects
      # the client bundle (NEXT_PUBLIC_*) and a local .dev.vars file, never
      # the deployed Worker's runtime. The deployed Worker only sees values
      # set here via `wrangler secret put`. Re-running this on every deploy
      # is idempotent (same value in, same value out) and keeps the secret
      # in sync with GitHub Secrets instead of relying on whatever was set
      # by hand once and never recorded anywhere. See
      # docs/plans/production-deploy.md for how this was discovered.
      - name: Set Worker secrets (dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "${{ secrets.CLERK_SECRET_KEY }}" | npx wrangler secret put CLERK_SECRET_KEY --name paibot-app-dev
          echo "${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}" | npx wrangler secret put NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY --name paibot-app-dev
