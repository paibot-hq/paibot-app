name: Migration (react-router spike)

# Validates the React Router migration spike under migration/react-router/
# in isolation, and deploys it to its own throwaway Worker
# (paibot-react-router-validation, rr-dev.paibot.app — behind Cloudflare
# Access, see infra/access.tf) for manual poking. This is NOT the
# production app. Remove this workflow (or fold it into app.yml) once the
# migration actually replaces the main app.

on:
  push:
    branches: [main]
    paths:
      - "migration/react-router/**"
      - ".github/workflows/migration-react-router.yml"
  pull_request:
    paths:
      - "migration/react-router/**"
      - ".github/workflows/migration-react-router.yml"

concurrency:
  group: migration-react-router-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: migration/react-router

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: migration/react-router/package-lock.json

      - run: npm ci

      # Same dev Clerk instance as the main app (reuses its repo secrets) —
      # see migration/react-router/.dev.vars for the var names this needs.
      - name: Set up .dev.vars
        run: |
          cat <<EOF > .dev.vars
          CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
          CLERK_KEYLESS_DISABLED=true
          EOF

      - run: npm run typecheck
      - run: npm run build

      - run: npx playwright install --with-deps chromium

      # CHECK_SITE_URL must match wrangler.jsonc's `vars.SITE_URL` (only sets
      # the smoke test's expectation, doesn't change the server) — see
      # migration/react-router/README.md.
      - name: check:smoke against a local preview server
        run: |
          npm run preview &
          for i in $(seq 1 30); do curl -sf http://localhost:3003/robots.txt > /dev/null && break; sleep 1; done
          CHECK_BROWSER_BASE_URL=http://localhost:3003 CHECK_SITE_URL=https://rr-dev.paibot.app npm run check:smoke

  deploy-dev:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: migration/react-router/package-lock.json

      - run: npm ci
      - run: npm run build

      # rr-dev.paibot.app (routes in wrangler.jsonc) — behind Cloudflare
      # Access, not a public URL. See infra/access.tf.
      - name: Deploy to Cloudflare Workers (rr-dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy

      # Same pattern as app.yml's deploy-dev: .dev.vars above only feeds the
      # local preview server in the verify job, never the deployed Worker.
      - name: Set Worker secrets (rr-dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "${{ secrets.CLERK_SECRET_KEY }}" | npx wrangler secret put CLERK_SECRET_KEY --name paibot-react-router-validation
          echo "${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}" | npx wrangler secret put CLERK_PUBLISHABLE_KEY --name paibot-react-router-validation
