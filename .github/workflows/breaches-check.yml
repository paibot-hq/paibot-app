name: Incident list sources

# Opens every source link of the incident list (src/data/breaches.json) once a week and fails when one is dead, so that an entry that is no longer
# backed by its source shows up in the Actions tab. Warnings (a page that does not show the count, a site that blocks bots) are printed, not failed:
# they are for a person to look at. See docs/breaches.md. Run it by hand from the Actions tab at any time.
on:
  schedule:
    - cron: "41 3 * * 3" # Wednesdays, 03:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      # The script uses Node's own modules only; no install is needed.
      - run: node scripts/check-breaches.mjs
