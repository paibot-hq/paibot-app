name: App (production)

# Manual only. Tag pushes are not used as a trigger: GitHub Environments'
# required-reviewer approval gate is unavailable on this org's Free plan (see
# infra/README.md), so there is no way to have a tag push auto-deploy while
# still stopping for a human confirmation. Running this workflow by hand is
# the confirmation step instead (same reasoning as infra-apply.yml).
#
# With no `ref` input: treated as a new release. A date-based tag
# (release-YYYY-MM-DD, with a numeric suffix for same-day reruns) is created
# from the current default branch and pushed before deploying.
# With a `ref` input: treated as a rollback/redeploy of an existing tag or
# commit. No new tag or GitHub Release is created.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "再デプロイ/ロールバック時のみ指定(タグ名かコミットSHA)。空なら現在のデフォルトブランチから新規リリースする"
        required: false

concurrency:
  group: app-production-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Determine release tag (new releases only)
        id: tag
        if: ${{ inputs.ref == '' }}
        run: |
          base="release-$(date -u +%Y-%m-%d)"
          tag="$base"
          n=1
          while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do
            n=$((n + 1))
            tag="${base}-${n}"
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create and push release tag
        if: ${{ inputs.ref == '' }}
        run: |
          git tag "${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # npm ci also runs postinstall (patch-package --error-on-fail --error-on-warn),
      # which must succeed before anything else can build correctly. See CLAUDE.md.
      - run: npm ci

      # SITE_INDEXABLE is NOT set here — it's read live from a Cloudflare
      # Workers var at request time, not from .env.local/process.env. Setting
      # it here was dead weight: it never reached the deployed Worker, so
      # production actually served noindex/Disallow: / (meta tag,
      # X-Robots-Tag, and robots.txt) from the first deploy until this was
      # caught and fixed by declaring `vars.SITE_INDEXABLE` under
      # env.production in wrangler.jsonc instead. Same root cause as the
      # CLERK_SECRET_KEY issue below — see docs/plans/production-deploy.md.
      - name: Set up .env.local (production Clerk keys)
        run: |
          cat <<EOF > .env.local
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.PROD_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY=${{ secrets.PROD_CLERK_SECRET_KEY }}
          SITE_URL=https://paibot.app
          EOF

      # CLOUDFLARE_ENV=production makes `@cloudflare/vite-plugin` merge
      # wrangler.jsonc's `env.production` block into the emitted
      # dist/server/wrangler.json at build time (name: paibot-app, routes:
      # paibot.app). Without it, vinext build silently emits the top-level
      # (dev) config instead — confirmed by testing locally, not documented
      # anywhere obvious. See wrangler.jsonc's comment and
      # docs/plans/production-deploy.md.
      - name: Build (production env)
        env:
          CLOUDFLARE_ENV: production
        run: npm run build

      - name: Deploy to Cloudflare Workers (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PRODUCTION }}
        # No --env flag here: the config is already resolved for production
        # by the build step above. Passing --env production on top of an
        # already-flattened config just produces a harmless but confusing
        # "no environment found" warning (confirmed locally).
        run: npx wrangler deploy --config dist/server/wrangler.json

      # These are separate from the .env.local step above: that only affects
      # the client bundle (NEXT_PUBLIC_*) and a local .dev.vars file, never
      # the deployed Worker's runtime. The deployed Worker only sees values
      # set here via `wrangler secret put`. Re-running this on every deploy
      # is idempotent and keeps the secret in sync with GitHub Secrets
      # instead of a manual one-off `wrangler secret put` nobody records
      # anywhere (this is exactly what broke the first production deploy —
      # see the "重大な誤解だったポイント" section in
      # docs/plans/production-deploy.md).
      - name: Set Worker secrets (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PRODUCTION }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "${{ secrets.PROD_CLERK_SECRET_KEY }}" | npx wrangler secret put CLERK_SECRET_KEY --name paibot-app
          echo "${{ secrets.PROD_CLERK_PUBLISHABLE_KEY }}" | npx wrangler secret put NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY --name paibot-app

      - name: Create GitHub Release
        if: ${{ inputs.ref == '' }}
        run: gh release create "${{ steps.tag.outputs.tag }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
