name: App (production)
# Manual dispatch is the production release approval. The ref input also
# supports pre-migration tags: their vinext build and secret names still work.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: '再デプロイ/ロールバック時のタグまたはSHA。空なら現在のコミットをリリース'
        required: false
concurrency:
  group: app-production-deploy
  cancel-in-progress: false
permissions:
  contents: write
  # Read App (development)'s run history for the gate below.
  actions: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      # New releases only: the commit being released must already have passed
      # App (development) on main (verify + dev deploy + Access smoke). Catches
      # dispatching before dev finished, or a commit dev rejected. Rollbacks
      # (ref set) skip it - an incident shouldn't be blockable by CI history.
      # A commit that only touched docs/infra never triggers App (development)
      # (paths-ignore), so release the last app commit via the ref input instead.
      - name: Require a successful development run for this commit
        if: inputs.ref == ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha=$(git rev-parse HEAD)
          runs=$(gh run list --workflow app.yml --commit "$sha" --event push --json status,conclusion,url --limit 20)
          if [ "$(echo "$runs" | jq '[.[] | select(.conclusion=="success")] | length')" -gt 0 ]; then
            echo "App (development) succeeded for $sha"
          elif [ "$(echo "$runs" | jq '[.[] | select(.status!="completed")] | length')" -gt 0 ]; then
            echo "::error::App (development) is still running for $sha - wait for it to finish, then dispatch again."
            exit 1
          else
            echo "::error::No successful App (development) run for $sha (merge to main and let dev pass first; docs/infra-only commits never run it - use the ref input with the last app commit)."
            echo "$runs" | jq -r '.[] | "  \(.conclusion) \(.url)"'
            exit 1
          fi
      # Releases use the repo's pinned Node; rollback refs from before the pin
      # have no .tool-versions and keep the Node 22 they were built with.
      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ hashFiles('.tool-versions') != '' && '.tool-versions' || '' }}
          node-version: ${{ hashFiles('.tool-versions') == '' && '22' || '' }}
          cache: npm
      - run: npm ci
      - name: Detect release framework
        id: framework
        run: echo "react_router=$(node -p 'Boolean(require("./package.json").dependencies["react-router"])')" >> "$GITHUB_OUTPUT"
      - name: Prepare local-only verification keys (React Router)
        if: steps.framework.outputs.react_router == 'true'
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: node -e 'require("fs").writeFileSync(".dev.vars.production", `CLERK_PUBLISHABLE_KEY=${process.env.CLERK_PUBLISHABLE_KEY}\nCLERK_SECRET_KEY=${process.env.CLERK_SECRET_KEY}\n`)'
      - name: Legacy rollback build keys
        if: steps.framework.outputs.react_router != 'true'
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.PROD_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.PROD_CLERK_SECRET_KEY }}
        run: node -e 'require("fs").writeFileSync(".env.local", `NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${process.env.CLERK_PUBLISHABLE_KEY}\nCLERK_SECRET_KEY=${process.env.CLERK_SECRET_KEY}\nSITE_URL=https://paibot.app\n`)'
      - if: steps.framework.outputs.react_router == 'true'
        run: npm run typecheck
      - name: Build production and verify deployment target
        id: build
        env:
          CLOUDFLARE_ENV: production
          REACT_ROUTER: ${{ steps.framework.outputs.react_router }}
        run: |
          npm run build
          if [ "$REACT_ROUTER" = true ]; then config=build/server/wrangler.json; else config=dist/server/wrangler.json; fi
          node -e 'const c=require("./"+process.argv[1]); if(c.name!=="paibot-app" || c.vars?.SITE_INDEXABLE!=="true" || c.vars?.SITE_URL!=="https://paibot.app") throw Error("Wrong production target or indexing configuration")' "$config"
          echo "config=$config" >> "$GITHUB_OUTPUT"
      - if: steps.framework.outputs.react_router == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.framework.outputs.react_router == 'true'
        run: npx playwright install --with-deps chromium
      # check-environments serves the production build, whose DB binding is the
      # production database ID, and /math set pages read D1 during SSR. Local
      # D1 state is kept per database ID, so migrate that one (--local: this
      # never touches the real production database).
      - if: steps.framework.outputs.react_router == 'true'
        run: npm run db:migrate:local:production
      # Called by file, not an npm script: a rollback can deploy a ref from
      # before the tests moved to tests/ (scripts/check-*.mjs until 2026-09).
      - if: steps.framework.outputs.react_router == 'true'
        run: if [ -f tests/e2e/environments.mjs ]; then node tests/e2e/environments.mjs; else node scripts/check-environments.mjs; fi
      - name: Sync production runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PRODUCTION }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.PROD_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.PROD_CLERK_SECRET_KEY }}
        run: |
          node -e 'if(!process.env.CLERK_PUBLISHABLE_KEY?.startsWith("pk_live_") || !process.env.CLERK_SECRET_KEY?.startsWith("sk_live_")) throw Error("Production Clerk keys required"); console.log(JSON.stringify({CLERK_PUBLISHABLE_KEY:process.env.CLERK_PUBLISHABLE_KEY,NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:process.env.CLERK_PUBLISHABLE_KEY,CLERK_SECRET_KEY:process.env.CLERK_SECRET_KEY}))' | npx wrangler secret bulk --config '${{ steps.build.outputs.config }}'
      # Before the deploy, so the new code never sees a schema it doesn't know
      # yet. Idempotent (wrangler skips what d1_migrations already records).
      # Gated on the ref actually having migrations: old vinext refs used for
      # rollbacks have no migrations/ (nor a production D1 binding), and a
      # rollback shouldn't be touching the schema anyway.
      - name: Apply D1 migrations (production)
        if: steps.framework.outputs.react_router == 'true' && hashFiles('migrations/*.sql') != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PRODUCTION }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote --env production
      - name: Import verified quiz questions (production)
        if: steps.framework.outputs.react_router == 'true' && hashFiles('scripts/import-quiz.mjs') != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PRODUCTION }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run quiz:import:prod
      - name: Import verified math problems (production)
        if: steps.framework.outputs.react_router == 'true' && hashFiles('scripts/import-math.mjs') != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PRODUCTION }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run math:import:prod
      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PRODUCTION }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config '${{ steps.build.outputs.config }}' --var "APP_VERSION:$(git rev-parse HEAD)"
      # A brand-new route can 404 on edge nodes that still serve the previous
      # version (run 36330242199), so wait until production reports the
      # released commit rather than sleeping. Legacy vinext refs never send
      # X-App-Version, so they keep the old fixed wait.
      - name: Wait for the deploy to reach the edge
        if: steps.framework.outputs.react_router == 'true'
        env:
          CHECK_BROWSER_BASE_URL: https://paibot.app
        run: EXPECTED_APP_VERSION="$(git rev-parse HEAD)" node scripts/wait-for-deploy.mjs
      - name: Wait for edge propagation (legacy refs)
        if: steps.framework.outputs.react_router != 'true'
        run: sleep 15
      - name: Verify deployed React Router app
        if: steps.framework.outputs.react_router == 'true'
        env:
          CHECK_BROWSER_BASE_URL: https://paibot.app
          CHECK_SITE_URL: https://paibot.app
          CHECK_SITE_INDEXABLE: 'true'
        run: |
          if [ -f tests/e2e/run.mjs ]; then npm run e2e -- smoke quiz-browser; else
            npm run check:smoke
            if [ -f scripts/check-quiz-browser.mjs ]; then npm run check:quiz-browser; fi
          fi
      - name: Tag successful new release
        if: inputs.ref == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base="release-$(date -u +%Y-%m-%d)"
          tag="$base"
          n=1
          while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do tag="${base}-${n}"; n=$((n + 1)); done
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" --generate-notes
