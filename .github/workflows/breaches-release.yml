name: Incident list release

# Copies the incident list (src/data/breaches.json) into the production database once App (development) has passed and copied it into dev's. The
# page reads the list from D1 (docs/breaches.md), so a merged update reaches production without a release of the app, whatever else is waiting to
# go out. It runs after every successful push to main (the import is the same rows again when the list has not changed) and only for the head of
# main, so that an older run never puts back an older list. Before the release that adds the tables it does nothing and says so in a notice.
on:
  workflow_run:
    workflows: ["App (development)"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: breaches-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The production database: the same environment as App (production), so the same branch rule applies.
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Is it still the head of main?
        id: head
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" != "$SHA" ]; then echo "::notice::main has moved on from $SHA; its own run copies the list."; exit 0; fi
          echo "current=true" >> "$GITHUB_OUTPUT"
      - if: steps.head.outputs.current == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - if: steps.head.outputs.current == 'true'
        run: npm ci
      - name: Copy the list into production
        if: steps.head.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PRODUCTION }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run breaches:import:prod -- --if-ready
